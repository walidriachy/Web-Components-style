<style>
/* ============================================================
   KIT TWO — DASHBOARD · ANALYTICS · FINANCE
   Same token contract as the product kit. Every chart is CSS or
   inline SVG painted from custom properties, so a design change
   repaints the whole dashboard. No chart library.
   ============================================================ */

.kit .d-wrap{display:flex; flex-direction:column; gap:var(--gap);}
.kit .d-grid{display:grid; gap:var(--gap);}
.kit .d-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.kit .d-3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));}
.kit .d-4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
.kit .d-wide{grid-template-columns:2fr 1fr;}
@media (max-width:820px){ .kit .d-wide{grid-template-columns:1fr;} }

/* ---------- panel ---------- */
.kit .d-panel{
  background:var(--surface); border:var(--bw) var(--bstyle) var(--bc);
  border-radius:var(--r); box-shadow:var(--sh); padding:var(--pad);
  display:flex; flex-direction:column; gap:12px; min-width:0;
}
.kit .d-ph{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.kit .d-ph h4{font-size:14.5px;}
.kit .d-ph .sub{font-size:11px; color:var(--ink-3); font-family:var(--f-m);}

/* ---------- KPI ---------- */
.kit .d-kpi{
  background:var(--surface); border:var(--bw) var(--bstyle) var(--bc);
  border-radius:var(--r); box-shadow:var(--sh); padding:15px 17px;
  display:flex; flex-direction:column; gap:7px; min-width:0;
}
.kit .d-kpi .lb{
  font-family:var(--f-m); font-size:var(--lab-size); letter-spacing:var(--lab-ls);
  text-transform:var(--lab-tt); color:var(--ink-3);
}
.kit .d-kpi .vl{
  font-family:var(--f-d); font-weight:var(--h-w); letter-spacing:var(--h-ls);
  font-size:27px; line-height:1.04; color:var(--ink); font-variant-numeric:tabular-nums;
}
.kit .d-kpi .ft{display:flex; align-items:center; gap:7px; font-size:11.5px;}
.kit .d-up{color:var(--ok);} .kit .d-dn{color:var(--err);} .kit .d-flat{color:var(--ink-3);}
.kit .d-kpi svg{display:block; width:100%; height:30px;}

/* ---------- chart frame ---------- */
.kit .d-chart{width:100%; display:block; overflow:visible;}
.kit .d-chart .grid{stroke:var(--bc); stroke-width:1; opacity:.75;}
.kit .d-chart .axis{fill:var(--ink-3); font-family:var(--f-m); font-size:8.5px;}
.kit .d-chart .ser1{stroke:var(--accent); fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round;}
.kit .d-chart .ser2{stroke:var(--accent-2); fill:none; stroke-width:2; stroke-dasharray:4 3; stroke-linejoin:round;}
.kit .d-chart .fill1{fill:var(--accent); opacity:.16;}
.kit .d-chart .dot{fill:var(--accent); stroke:var(--surface); stroke-width:2;}
.kit .d-chart .barA{fill:var(--accent);} .kit .d-chart .barB{fill:var(--accent-2);}
.kit .d-chart .barC{fill:var(--surface-3);}
.kit .d-chart .pos{fill:var(--ok);} .kit .d-chart .neg{fill:var(--err);}
.kit .d-chart .wick{stroke:var(--ink-3); stroke-width:1;}
.kit .d-chart .lbl{fill:var(--ink-2); font-family:var(--f-b); font-size:9px;}
.kit .d-chart .ring-track{stroke:var(--surface-3); fill:none;}
.kit .d-chart .ring-val{stroke:var(--accent); fill:none; stroke-linecap:round;}

/* ---------- legend ---------- */
.kit .d-legend{display:flex; flex-wrap:wrap; gap:8px 16px; font-size:11px; color:var(--ink-2);}
.kit .d-legend span{display:inline-flex; align-items:center; gap:6px;}
.kit .d-legend i{width:9px; height:9px; border-radius:calc(var(--r-sm) / 2); display:block;}

/* ---------- horizontal bars ---------- */
.kit .d-hbars{display:flex; flex-direction:column; gap:9px;}
.kit .d-hbar{display:grid; grid-template-columns:88px 1fr 58px; gap:10px; align-items:center; font-size:12px;}
.kit .d-hbar .tr{height:16px; background:var(--surface-2); border-radius:var(--r-sm); overflow:hidden;}
.kit .d-hbar .tr i{display:block; height:100%; background:var(--accent); border-radius:var(--r-sm);}
.kit .d-hbar .nm{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.kit .d-hbar .vv{font-family:var(--f-m); font-variant-numeric:tabular-nums; text-align:right; color:var(--ink);}

/* ---------- heat calendar ---------- */
.kit .d-heat{display:grid; grid-template-columns:repeat(26,1fr); gap:3px;}
.kit .d-heat i{aspect-ratio:1; border-radius:2px; background:var(--accent); display:block;}

/* ---------- treemap ---------- */
.kit .d-tree{display:flex; gap:4px; height:150px;}
.kit .d-tree > div{display:flex; flex-direction:column; gap:4px;}
.kit .d-tree .cell{
  border-radius:var(--r-sm); padding:8px 9px; display:flex; flex-direction:column; justify-content:flex-end;
  color:var(--on-accent); font-size:10.5px; line-height:1.25; overflow:hidden; min-width:0;
}
.kit .d-tree .cell b{font-family:var(--f-m); font-size:11px;}

/* ---------- gauge ---------- */
.kit .d-gauge{display:flex; align-items:center; gap:16px;}
.kit .d-gauge .g{
  width:104px; height:104px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:conic-gradient(from 218deg, var(--accent) 0 var(--g,62%), var(--surface-3) var(--g,62%) 72%, transparent 72%);
}
.kit .d-gauge .g span{
  width:76px; height:76px; border-radius:50%; background:var(--surface);
  display:grid; place-items:center; font-family:var(--f-d); font-weight:var(--h-w);
  font-size:19px; color:var(--ink); font-variant-numeric:tabular-nums;
}

/* ---------- dense data table ---------- */
.kit .d-tw{overflow-x:auto; border:var(--bw) var(--bstyle) var(--bc); border-radius:var(--r); background:var(--surface);}
.kit .d-table{border-collapse:collapse; width:100%; min-width:660px; font-size:12.5px;}
.kit .d-table th{
  text-align:left; font-family:var(--f-m); font-size:var(--lab-size); font-weight:var(--lab-w);
  letter-spacing:var(--lab-ls); text-transform:var(--lab-tt); color:var(--ink-3);
  padding:9px 13px; background:var(--surface-2); border-bottom:var(--bw) var(--bstyle) var(--bc); white-space:nowrap;
}
.kit .d-table td{padding:8px 13px; border-bottom:var(--bw) var(--bstyle) var(--bc); color:var(--ink-2); white-space:nowrap;}
.kit .d-table tbody tr:last-child td{border-bottom:0;}
.kit .d-table td:first-child{color:var(--ink); font-weight:600;}
.kit .d-table .num{font-family:var(--f-m); font-variant-numeric:tabular-nums; text-align:right;}
.kit .d-table tfoot td{
  font-family:var(--f-m); font-weight:700; color:var(--ink);
  background:var(--surface-2); border-top:calc(var(--bw) + 1px) var(--bstyle) var(--bc);
}
.kit .d-table .heat{border-radius:var(--r-sm); padding:2px 7px; display:inline-block; font-family:var(--f-m);}
.kit .d-table .mini{width:56px; height:16px; display:block;}

/* ---------- order book ---------- */
.kit .d-book{display:grid; grid-template-columns:1fr 1fr; gap:0; font-family:var(--f-m); font-size:11px;}
.kit .d-book .side{display:flex; flex-direction:column;}
.kit .d-book .r{
  display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:3px 9px;
  position:relative; font-variant-numeric:tabular-nums;
}
.kit .d-book .r i{position:absolute; top:0; bottom:0; opacity:.16; display:block;}
.kit .d-book .bid i{background:var(--ok); right:0;} .kit .d-book .bid .p{color:var(--ok);}
.kit .d-book .ask i{background:var(--err); left:0;} .kit .d-book .ask .p{color:var(--err);}
.kit .d-book .q{text-align:right; color:var(--ink-2); position:relative;}
.kit .d-book .p{position:relative;}
.kit .d-spread{
  grid-column:1 / -1; text-align:center; padding:6px; font-size:10.5px; color:var(--ink-3);
  border-top:var(--bw) var(--bstyle) var(--bc); border-bottom:var(--bw) var(--bstyle) var(--bc);
  background:var(--surface-2);
}

/* ---------- ticker ---------- */
.kit .d-ticker{
  overflow:hidden; border-top:var(--bw) var(--bstyle) var(--bc);
  border-bottom:var(--bw) var(--bstyle) var(--bc); padding:8px 0; background:var(--surface-2);
}
.kit .d-ticker .tape{
  display:flex; gap:30px; white-space:nowrap; font-family:var(--f-m); font-size:11.5px;
  animation:dTape 34s linear infinite; will-change:transform;
}
@keyframes dTape{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
.kit .d-ticker b{color:var(--ink); font-weight:600;}

/* ---------- statement / ledger ---------- */
.kit .d-stmt{display:flex; flex-direction:column; font-size:12.5px;}
.kit .d-stmt .li{
  display:flex; justify-content:space-between; gap:14px; padding:7px 0;
  border-bottom:var(--bw) var(--bstyle) var(--bc); color:var(--ink-2);
}
.kit .d-stmt .li.ind{padding-left:16px; font-size:12px;}
.kit .d-stmt .li.tot{
  border-bottom:0; border-top:calc(var(--bw) + 1px) var(--bstyle) var(--bc);
  margin-top:5px; padding-top:10px; color:var(--ink); font-weight:700;
}
.kit .d-stmt .li .v{font-family:var(--f-m); font-variant-numeric:tabular-nums;}

/* ---------- payment card ---------- */
.kit .d-card{
  border-radius:var(--r-lg); padding:19px; aspect-ratio:1.6; max-width:290px;
  background:var(--accent); background-image:var(--grad); color:var(--on-accent);
  display:flex; flex-direction:column; justify-content:space-between; box-shadow:var(--sh-lg);
  border:var(--btn-bw) var(--bstyle) var(--bc);
}
.kit .d-card .no{font-family:var(--f-m); font-size:15px; letter-spacing:.11em;}
.kit .d-card .rw{display:flex; justify-content:space-between; align-items:flex-end; font-size:10.5px; opacity:.86;}
.kit .d-card .chip{width:34px; height:25px; border-radius:4px; background:rgba(255,255,255,.4);}

/* ---------- allocation ---------- */
.kit .d-alloc{display:flex; height:13px; border-radius:var(--r-pill); overflow:hidden; background:var(--surface-2);}
.kit .d-alloc i{display:block; height:100%;}

/* ---------- filter bar ---------- */
.kit .d-filters{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 13px;
  background:var(--surface-2); border:var(--bw) var(--bstyle) var(--bc); border-radius:var(--r);
}
.kit .d-range{
  display:inline-flex; align-items:center; gap:8px; padding:6px 11px; font-size:12px;
  background:var(--in-bg); border:var(--bw) var(--bstyle) var(--in-bc); border-radius:var(--in-r);
  color:var(--ink-2); cursor:pointer;
}
.kit .d-live{display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-3); font-family:var(--f-m);}
.kit .d-live i{width:7px; height:7px; border-radius:50%; background:var(--ok); display:block; animation:dPulse 2s ease-in-out infinite;}
@keyframes dPulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ---------- misc ---------- */
.kit .d-delta{
  font-family:var(--f-m); font-size:11px; font-variant-numeric:tabular-nums;
  padding:2px 6px; border-radius:var(--r-sm);
}
.kit .d-delta.up{background:var(--ok-soft); color:var(--ok);}
.kit .d-delta.dn{background:var(--err-soft); color:var(--err);}
.kit .d-scroll{max-height:230px; overflow-y:auto;}

@media (prefers-reduced-motion:reduce){
  .kit .d-ticker .tape,.kit .d-live i{animation:none;}
}

/* ---------- kit view switching ---------- */
.kit[data-kitview="product"] .d-only{display:none;}
.kit[data-kitview="dash"] .p-only{display:none;}
</style>
