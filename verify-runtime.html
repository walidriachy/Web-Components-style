<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Component runtime verification</title>
<style>
  body{margin:0;background:#07080D;color:#F2F4F8;font:13px ui-monospace,Menlo,monospace;padding:16px;}
  /* Cells sit INSIDE the viewport, stacked on top of each other and nearly transparent.
     Components that pause when off screen (IntersectionObserver) would otherwise never
     draw, and be reported as empty for doing exactly the right thing. */
  #stageHost{position:fixed;left:0;top:0;width:1200px;height:0;opacity:.02;pointer-events:none;z-index:-1;}
  .cell{position:absolute;left:0;top:0;width:340px;min-height:158px;padding:20px;background:#0A0C12;box-sizing:border-box;}
  .cell.full{width:1180px;padding:18px;}
  #out{white-space:pre-wrap;line-height:1.6;}
  .bad{color:#FF2D6F;} .ok{color:#3BE08A;} .warn{color:#FFC24B;}
</style>
</head>
<body>
<h1 style="font-size:15px;margin:0 0 12px">Runtime verification</h1>
<div id="out">loading…</div>
<div id="stageHost"></div>
<script>
/* WebGL canvases discard their drawing buffer after each frame is presented, so
   reading their pixels afterwards returns nothing. Force preserveDrawingBuffer for
   every WebGL context created on this page so what was drawn can be sampled. */
(function () {
  /* An embedded or background pane reports document.hidden = true, and components that
     correctly pause in a hidden tab then never draw. Measure them as a visible page. */
  try {
    Object.defineProperty(Document.prototype, 'hidden', { configurable: true, get: function () { return false; } });
    Object.defineProperty(Document.prototype, 'visibilityState', { configurable: true, get: function () { return 'visible'; } });
  } catch (e) {}
  var orig = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, attrs) {
    if (/webgl/.test(String(type))) {
      attrs = Object.assign({}, attrs || {}, { preserveDrawingBuffer: true });
      this.__webgl = true;
    }
    return orig.call(this, type, attrs);
  };
})();
</script>
<script src="components.js"></script>
<script>
/* Mounts every component the way library.html does — same html/css/js strings, same
   `new Function("root", js)(rootEl)` call — and records what actually happens:
     * throws at mount
     * throws LATER, inside a timer or animation frame (attributed via sourceURL)
     * mounts cleanly but paints nothing
     * canvases (2D and WebGL) that draw nothing
   Batched so hundreds of live loops and WebGL contexts never run at once. */
(function () {
  var C = window.COMPONENTS || [];
  /* ?only=fxs-,dbs-funnel verifies just the components whose id starts with any prefix */
  var only = (/[?&]only=([^&]+)/.exec(location.search) || [])[1];
  if (only) {
    var pre = decodeURIComponent(only).split(',');
    C = C.filter(function (c) { return pre.some(function (p) { return c.id.indexOf(p) === 0; }); });
  }
  var host = document.getElementById('stageHost');
  var out = document.getElementById('out');

  /* Embedded/hidden panes freeze requestAnimationFrame entirely — document.hidden is
     true and zero frames are delivered. Any component that paints only inside a rAF
     loop then measures as an empty canvas, which reads as a failure when nothing is
     actually wrong. setTimeout still runs in that state, so when no frame arrives
     within 300ms we substitute a timer-driven rAF and report which mode was used. */
  var rafLive = false, rafMode = 'native';
  requestAnimationFrame(function () { rafLive = true; });
  function installShimIfFrozen(next) {
    setTimeout(function () {
      if (!rafLive) {
        rafMode = 'shimmed (native rAF is frozen in this view)';
        window.requestAnimationFrame = function (fn) {
          return setTimeout(function () { fn(performance.now()); }, 16);
        };
        window.cancelAnimationFrame = function (id) { clearTimeout(id); };
        /* IntersectionObserver and ResizeObserver deliver their callbacks in the same
           rendering steps as rAF, so in a frozen view they never fire either — and a
           component that sizes its canvas or starts its loop from one of them stays
           at the default 300x150 and draws nothing. Every cell here is in the viewport
           by construction, so reporting "intersecting" and the element's real size is
           the truth, just delivered on a timer. */
        installObserverShims();
        rafMode += ' + IntersectionObserver/ResizeObserver shimmed';
      }
      next();
    }, 300);
  }

  function installObserverShims() {
    function boxes(el) {
      var r = el.getBoundingClientRect(), cs = getComputedStyle(el);
      var pw = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) +
               parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
      var ph = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) +
               parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
      var w = Math.max(0, r.width - pw), h = Math.max(0, r.height - ph);
      var dpr = window.devicePixelRatio || 1;
      return { r: r, w: w, h: h, dpr: dpr };
    }
    function Observer(kind, cb) {
      var self = this, targets = [];
      this.observe = function (el) {
        if (targets.indexOf(el) === -1) targets.push(el);
        setTimeout(function () {
          if (targets.indexOf(el) === -1 || !el.isConnected) return;
          var b = boxes(el), entry;
          if (kind === 'io') {
            entry = { target: el, isIntersecting: true, intersectionRatio: 1, boundingClientRect: b.r,
                      intersectionRect: b.r, rootBounds: null, time: performance.now() };
          } else {
            entry = { target: el,
                      contentRect: { x: 0, y: 0, top: 0, left: 0, width: b.w, height: b.h, right: b.w, bottom: b.h },
                      contentBoxSize: [{ inlineSize: b.w, blockSize: b.h }],
                      borderBoxSize: [{ inlineSize: b.r.width, blockSize: b.r.height }],
                      devicePixelContentBoxSize: [{ inlineSize: Math.round(b.w * b.dpr), blockSize: Math.round(b.h * b.dpr) }] };
          }
          try { cb([entry], self); } catch (e) { setTimeout(function () { throw e; }); }
        }, 0);
      };
      this.unobserve = function (el) { var i = targets.indexOf(el); if (i > -1) targets.splice(i, 1); };
      this.disconnect = function () { targets.length = 0; };
      this.takeRecords = function () { return []; };
    }
    window.IntersectionObserver = function (cb) { Observer.call(this, 'io', cb); };
    window.ResizeObserver = function (cb) { Observer.call(this, 'ro', cb); };
  }

  /* Errors raised after mount (in a timer, a frame, an observer) carry the
     sourceURL of the component that threw. */
  var asyncErr = {};
  function noteAsync(msg, file) {
    var m = /components\/([a-z0-9-]+)\.js/.exec(file || '');
    if (m && !asyncErr[m[1]]) asyncErr[m[1]] = msg;
  }
  window.addEventListener('error', function (e) {
    noteAsync(e.message, e.filename || (e.error && e.error.stack) || '');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason || {};
    noteAsync(String(r.message || r), String(r.stack || ''));
  });

  var results = [];
  var BATCH = 20, SETTLE = 900;

  function canvasLit(cv) {
    try {
      var w = cv.width, h = cv.height;
      if (!w || !h) return 0;
      var src = cv, g = null;
      if (cv.__webgl) {
        var tmp = document.createElement('canvas');
        tmp.width = w; tmp.height = h;
        g = tmp.getContext('2d');
        g.drawImage(cv, 0, 0);
      } else {
        g = cv.getContext('2d');
        if (!g) return -1;
      }
      var d = g.getImageData(0, 0, w, h).data, lit = 0;
      for (var p = 0; p < d.length; p += 4 * 37) {
        if (d[p + 3] > 8 && (d[p] + d[p + 1] + d[p + 2]) > 6) lit++;
      }
      return lit;
    } catch (e) { return -1; }
  }

  function measure(cell, c) {
    var r = { id: c.id, cat: c.cat, span: c.span || '' };
    var kids = cell.querySelectorAll('*');
    r.nodes = kids.length;
    var painted = 0;
    for (var i = 0; i < kids.length; i++) {
      var b = kids[i].getBoundingClientRect();
      if (b.width > 1 && b.height > 1) painted++;
    }
    r.painted = painted;
    var rootEl = cell.querySelector('.' + c.id) || cell.firstElementChild;
    if (rootEl) {
      var rb = rootEl.getBoundingClientRect();
      r.w = Math.round(rb.width); r.h = Math.round(rb.height);
      /* a component wider than the cell it was given is overflowing its layout */
      r.overflowX = rootEl.scrollWidth > rootEl.clientWidth + 2 &&
                    getComputedStyle(rootEl).overflowX === 'visible';
    }
    var cvs = cell.querySelectorAll('canvas');
    if (cvs.length) {
      r.canvases = cvs.length;
      r.webgl = Array.prototype.some.call(cvs, function (x) { return x.__webgl; });
      var best = 0, any = false;
      Array.prototype.forEach.call(cvs, function (cv) {
        var l = canvasLit(cv);
        if (l >= 0) { any = true; best = Math.max(best, l); }
      });
      r.canvasLit = any ? best : -1;
    }
    return r;
  }

  function runBatch(start, done) {
    var slice = C.slice(start, start + BATCH);
    var style = document.createElement('style');
    style.textContent = slice.map(function (c) { return c.css || ''; }).join('\n');
    document.head.appendChild(style);
    var cells = [];
    slice.forEach(function (c) {
      var cell = document.createElement('div');
      cell.className = c.span === 'full' ? 'cell full' : 'cell';
      host.appendChild(cell);           /* attach BEFORE mount — detached nodes have no layout */
      var rec = { c: c, cell: cell, err: null };
      try {
        cell.innerHTML = c.html;
        if ((c.js || '').trim()) {
          var rootEl = cell.querySelector('.' + c.id) || cell.firstElementChild;
          if (!rootEl) throw new Error('no root element matching .' + c.id);
          new Function('root', c.js + '\n//# sourceURL=components/' + c.id + '.js')(rootEl);
        }
      } catch (e) {
        rec.err = (e && e.message) || String(e);
      }
      cells.push(rec);
    });
    setTimeout(function () {
      cells.forEach(function (rec) {
        var r = rec.err
          ? { id: rec.c.id, cat: rec.c.cat, error: rec.err }
          : measure(rec.cell, rec.c);
        results.push(r);
        rec.cell.remove();
      });
      style.remove();
      out.textContent = 'verified ' + results.length + ' / ' + C.length + ' …';
      if (start + BATCH < C.length) setTimeout(function () { runBatch(start + BATCH, done); }, 60);
      else setTimeout(done, 400);   /* let any last async errors land */
    }, SETTLE);
  }

  installShimIfFrozen(function () { runBatch(0, function () {
    results.forEach(function (r) { if (!r.error && asyncErr[r.id]) r.asyncError = asyncErr[r.id]; });
    var errs  = results.filter(function (r) { return r.error; });
    var aerrs = results.filter(function (r) { return r.asyncError; });
    var blank = results.filter(function (r) { return !r.error && r.painted === 0; });
    var dark  = results.filter(function (r) { return !r.error && r.canvasLit === 0; });
    var over  = results.filter(function (r) { return r.overflowX; });
    var sum = {
      total: results.length,
      errors: errs.length,
      asyncErrors: aerrs.length,
      blank: blank.length,
      darkCanvas: dark.length,
      overflowing: over.length,
      webglComponents: results.filter(function (r) { return r.webgl; }).length,
      fullSpan: results.filter(function (r) { return r.span === 'full'; }).length,
      rafMode: rafMode,
      errorList: errs.map(function (r) { return r.id + ' :: ' + r.error; }),
      asyncErrorList: aerrs.map(function (r) { return r.id + ' :: ' + r.asyncError; }),
      blankList: blank.map(function (r) { return r.id; }),
      darkList: dark.map(function (r) { return r.id; }),
      overflowList: over.map(function (r) { return r.id + ' (' + r.w + 'px)'; })
    };
    window.__VERIFY__ = { summary: sum, results: results };
    function line(n, label, cls) { return '<span class="' + (n ? cls : 'ok') + '">' + label + ': ' + n + '</span>\n'; }
    function list(t, a) { return a.length ? t + '\n  ' + a.join('\n  ') + '\n\n' : ''; }
    out.innerHTML =
      '<b>' + sum.total + '</b> components mounted (' + sum.fullSpan + ' full-span, ' +
      sum.webglComponents + ' WebGL)\nanimation clock: ' + rafMode + '\n' +
      line(sum.errors, 'errors at mount', 'bad') +
      line(sum.asyncErrors, 'errors after mount', 'bad') +
      line(sum.blank, 'blank (nothing painted)', 'warn') +
      line(sum.darkCanvas, 'canvas drawing nothing', 'warn') +
      line(sum.overflowing, 'overflowing their width', 'warn') + '\n' +
      list('ERRORS AT MOUNT', sum.errorList) + list('ERRORS AFTER MOUNT', sum.asyncErrorList) +
      list('BLANK', sum.blankList) + list('DARK CANVAS', sum.darkList) +
      list('OVERFLOWING', sum.overflowList);
    document.title = 'DONE ' + sum.errors + 'e/' + sum.asyncErrors + 'a/' + sum.blank + 'b';
  }); });
})();
</script>
</body>
</html>
