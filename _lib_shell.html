<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Component Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{
  --void:#07080D; --panel:#0D0F16; --panel2:#12141C; --line:rgba(255,255,255,.09);
  --ink:#F2F4F8; --dim:#8A94A6; --faint:#525C6E;
  --cy:#38F2E4; --hot:#FF2D6F; --vi:#8B5CF6; --gold:#FFC24B; --ok:#3BE08A;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --disp:"Anton","Arial Black",sans-serif;
  --body:"Space Grotesk",system-ui,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
a{color:inherit;}

/* shell */
.lay{display:grid;grid-template-columns:224px 1fr;min-height:100vh;}

}

.side{
  position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);
  padding:64px 14px 30px;background:var(--panel);
}
.side h1{font-family:var(--disp);font-size:19px;text-transform:uppercase;margin:0 0 4px;letter-spacing:.01em;}
.side .cnt{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px;display:block;}
.side nav{display:flex;flex-direction:column;gap:1px;}
.side nav button{
  all:unset;cursor:pointer;padding:8px 11px;border-radius:7px;font-size:12.5px;color:var(--dim);
  display:flex;justify-content:space-between;gap:10px;transition:background .16s,color .16s;
}
.side nav button:hover{background:rgba(255,255,255,.05);color:var(--ink);}
.side nav button[aria-current="true"]{background:var(--cy);color:#04231F;font-weight:600;}
.side nav button i{font-style:normal;font-family:var(--mono);font-size:10px;opacity:.7;}
.side .tools{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;}

.main{padding:64px 26px 100px;min-width:0;}
.bar{
  position:sticky;top:0;z-index:30;margin:-64px -26px 22px;padding:14px 26px;
  background:rgba(7,8,13,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap;
}
.in{
  flex:1 1 240px;min-width:0;font-family:var(--mono);font-size:12.5px;padding:9px 13px;
  background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;outline:none;
}
.in:focus{border-color:var(--cy);}
.in::placeholder{color:var(--faint);}
.btn{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;
  background:var(--panel2);color:var(--dim);border:1px solid var(--line);transition:.16s;
}
.btn:hover{border-color:var(--cy);color:var(--cy);}
.btn.pri{background:var(--cy);color:#04231F;border-color:var(--cy);font-weight:600;}
.btn.pri:hover{filter:brightness(1.08);}
.count{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto;white-space:nowrap;}

.head{margin-bottom:26px;}
.head h2{font-family:var(--disp);font-size:clamp(28px,4vw,46px);text-transform:uppercase;margin:0;line-height:.95;}
.head p{color:var(--dim);max-width:64ch;margin:12px 0 0;font-size:14.5px;line-height:1.6;}

.catrow{margin:36px 0 14px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:9px;}
.catrow h3{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cy);margin:0;}
.catrow span{font-family:var(--mono);font-size:10px;color:var(--faint);}
.catrow .btn{margin-left:auto;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;}
.card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;}
.stage{
  min-height:158px;padding:20px;display:grid;place-items:center;background:#0A0C12;
  border-bottom:1px solid var(--line);position:relative;overflow:hidden;
}
.stage > *{max-width:100%;}
.meta{padding:12px 14px;display:flex;flex-direction:column;gap:4px;}
.meta b{font-size:13.5px;font-weight:600;}
.meta small{color:var(--faint);font-size:11.5px;line-height:1.5;}
.acts{display:flex;gap:5px;padding:0 14px 12px;flex-wrap:wrap;}
.acts .btn{padding:6px 9px;font-size:9.5px;}

.code{border-top:1px solid var(--line);display:none;}
.card.open .code{display:block;}
.tabs{display:flex;gap:2px;padding:8px 10px 0;background:var(--panel2);}
.tabs button{
  all:unset;cursor:pointer;padding:6px 11px;border-radius:6px 6px 0 0;font-family:var(--mono);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
}
.tabs button[aria-selected="true"]{background:#0A0C12;color:var(--cy);}
pre{
  margin:0;background:#0A0C12;padding:14px 16px;overflow-x:auto;max-height:330px;
  font-family:var(--mono);font-size:11px;line-height:1.65;color:var(--dim);tab-size:2;
}
pre .t{color:var(--hot);} pre .a{color:var(--gold);} pre .s{color:var(--ok);}
pre .k{color:var(--vi);} pre .c{color:var(--faint);font-style:italic;}
.stage.forced > *:not(.forcedtag){position:static!important;display:block!important;opacity:1!important;visibility:visible!important;transform:none!important;pointer-events:auto!important;}
.forcedtag{position:absolute;left:8px;bottom:8px;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:rgba(255,194,75,.12);border:1px solid rgba(255,194,75,.3);padding:3px 6px;border-radius:4px;}
.empty{display:none;padding:60px 0;color:var(--faint);font-family:var(--mono);font-size:12.5px;}
.err{padding:14px;color:var(--hot);font-family:var(--mono);font-size:10.5px;line-height:1.5;}

.toast{
  position:fixed;right:18px;bottom:18px;z-index:200;background:var(--cy);color:#04231F;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;padding:11px 16px;border-radius:9px;
  opacity:0;transform:translateY(12px);transition:.22s;pointer-events:none;font-weight:600;
}
.toast.on{opacity:1;transform:none;}
/* Stacked layout: a 45-item vertical sidebar would push every component
   almost 1800px down the page. Collapse it to a horizontal scrolling
   strip so the first component stays near the top of the screen. */
@media (max-width:900px){
  .lay{grid-template-columns:1fr;}
  .side{position:static;height:auto;padding:54px 12px 10px;border-right:0;border-bottom:1px solid var(--line);}
  .side h1{display:inline-block;margin:0 8px 6px 0;font-size:15px;}
  .side .cnt{display:inline-block;margin:0 0 6px;}
  .side nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
  .side nav button{flex:0 0 auto;white-space:nowrap;padding:7px 10px;}
  .side nav button i{margin-left:6px;}
  .side .tools{flex-direction:row;margin-top:8px;padding-top:8px;}
  .side .tools .btn{flex:1;text-align:center;}
  .main{padding-top:18px;}
  .bar{margin-top:-18px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<style id="compStyles"></style>
