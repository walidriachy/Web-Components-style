<style>
/* ============================================================
   THE KIT — one markup set, ~60 components, drawn entirely
   from the token contract below. A style block redefines the
   tokens; every component follows automatically.
   ============================================================ */

.kit, .tile-face {
  /* surfaces */
  --bg: #FFFFFF; --bg-2: #F6F7F9; --surface: #FFFFFF; --surface-2: #F2F4F7; --surface-3: #E8EBEF;
  /* ink */
  --ink: #14171B; --ink-2: #545D69; --ink-3: #8A94A0;
  /* brand */
  --accent: #2C6BED; --on-accent: #FFFFFF; --accent-2: #1B4FBF; --accent-soft: #E4EBFC;
  /* semantic */
  --ok: #16A34A; --warn: #D97706; --err: #DC2626; --info: #2563EB;
  --ok-soft: #DCFCE7; --warn-soft: #FEF3C7; --err-soft: #FEE2E2; --info-soft: #DBEAFE;
  /* line */
  --bw: 1px; --bc: #DFE3E8; --bstyle: solid;
  /* shape */
  --r: 8px; --r-sm: 5px; --r-lg: 14px; --r-pill: 999px;
  /* elevation */
  --sh: 0 1px 2px rgba(16,24,40,.06); --sh-lg: 0 12px 32px -12px rgba(16,24,40,.2); --sh-in: none;
  /* type */
  --f-d: "Inter", system-ui, sans-serif;
  --f-b: "Inter", system-ui, sans-serif;
  --f-m: "IBM Plex Mono", ui-monospace, monospace;
  --h-w: 700; --h-ls: -.022em; --h-tt: none; --h-lh: 1.12;
  --b-lh: 1.6; --b-ls: 0; --b-size: 14.5px;
  --lab-tt: uppercase; --lab-ls: .08em; --lab-w: 600; --lab-size: 10.5px;
  /* controls */
  --btn-r: var(--r); --btn-w: 600; --btn-tt: none; --btn-ls: 0;
  --btn-sh: var(--sh); --btn-pad: 10px 18px; --btn-bw: 0px;
  --in-bg: #FFFFFF; --in-bc: var(--bc); --in-r: var(--r); --in-sh: none;
  /* atmosphere */
  --blur: 0px; --tex: none; --grad: none; --overlay: none;
  --pad: 22px; --gap: 16px;
}

/* ---------- stage frame ---------- */
.kit {
  background-color: var(--bg);
  background-image: var(--grad), var(--tex);
  color: var(--ink);
  font-family: var(--f-b);
  font-size: var(--b-size);
  line-height: var(--b-lh);
  letter-spacing: var(--b-ls);
  padding: 30px;
  position: relative;
  isolation: isolate;
}
.kit::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: var(--overlay); z-index: 3;
}
.kit > * { position: relative; z-index: 1; }

.kit h1, .kit h2, .kit h3, .kit h4 {
  font-family: var(--f-d); font-weight: var(--h-w);
  letter-spacing: var(--h-ls); text-transform: var(--h-tt);
  line-height: var(--h-lh); margin: 0; color: var(--ink);
  text-wrap: balance;
}
.kit h1 { font-size: 40px; } .kit h2 { font-size: 27px; }
.kit h3 { font-size: 19px; }  .kit h4 { font-size: 15.5px; }
.kit p { margin: 0; color: var(--ink-2); }
.kit a { color: var(--accent); text-underline-offset: 3px; }
.kit small { font-size: 11.5px; color: var(--ink-3); }
.kit code, .kit .mono { font-family: var(--f-m); }
.kit strong { color: var(--ink); font-weight: 700; }
.kit ul { margin: 0; padding-left: 18px; color: var(--ink-2); }

/* ---------- layout scaffolding ---------- */
.k-group { display: flex; flex-direction: column; gap: 14px; padding: 34px 0; border-bottom: var(--bw) var(--bstyle) var(--bc); }
.k-group:last-child { border-bottom: 0; padding-bottom: 6px; }
.k-group:first-child { padding-top: 6px; }
.k-gtitle {
  font-family: var(--f-m); font-size: var(--lab-size); font-weight: var(--lab-w);
  letter-spacing: var(--lab-ls); text-transform: var(--lab-tt); color: var(--accent);
  display: flex; align-items: center; gap: 10px;
}
.k-gtitle::after { content: ""; flex: 1; height: var(--bw); background: var(--bc); }
.k-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.k-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: var(--gap); align-items: start; }
.k-cols3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--gap); align-items: start; }
.k-lab { font-family: var(--f-m); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.k-stack { display: flex; flex-direction: column; gap: 10px; }

/* ---------- surfaces ---------- */
.k-card {
  background: var(--surface);
  border: var(--bw) var(--bstyle) var(--bc);
  border-radius: var(--r);
  box-shadow: var(--sh);
  backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
  padding: var(--pad);
  display: flex; flex-direction: column; gap: 12px;
}
.k-card.flush { padding: 0; overflow: hidden; }
.k-panel { background: var(--surface-2); border-radius: var(--r); padding: 16px; border: var(--bw) var(--bstyle) var(--bc); }

/* ---------- buttons ---------- */
.k-btn {
  font-family: var(--f-b); font-size: 13.5px; font-weight: var(--btn-w);
  letter-spacing: var(--btn-ls); text-transform: var(--btn-tt);
  padding: var(--btn-pad); border-radius: var(--btn-r);
  border: var(--btn-bw) var(--bstyle) var(--bc);
  background: var(--accent); color: var(--on-accent);
  box-shadow: var(--btn-sh); cursor: pointer; line-height: 1.2;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  transition: filter .15s ease, transform .1s ease;
}
.k-btn:hover { filter: brightness(1.08); }
.k-btn:active { transform: translateY(1px); }
.k-btn.sec { background: var(--surface-2); color: var(--ink); border: var(--bw) var(--bstyle) var(--bc); }
.k-btn.ghost { background: transparent; color: var(--accent); box-shadow: none; border: var(--bw) var(--bstyle) transparent; }
.k-btn.out { background: transparent; color: var(--accent); border: var(--bw) var(--bstyle) var(--accent); box-shadow: none; }
.k-btn.danger { background: var(--err); color: #fff; }
.k-btn.sm { padding: 6px 12px; font-size: 12px; }
.k-btn.lg { padding: 14px 26px; font-size: 15.5px; }
.k-btn.ico { padding: 9px 11px; }
.k-btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.k-btn.block { width: 100%; }
.k-bgroup { display: inline-flex; }
.k-bgroup .k-btn { border-radius: 0; box-shadow: none; }
.k-bgroup .k-btn:first-child { border-radius: var(--btn-r) 0 0 var(--btn-r); }
.k-bgroup .k-btn:last-child { border-radius: 0 var(--btn-r) var(--btn-r) 0; }
.k-seg { display: inline-flex; background: var(--surface-2); border-radius: var(--btn-r); padding: 3px; border: var(--bw) var(--bstyle) var(--bc); gap: 2px; }
.k-seg span { padding: 6px 14px; border-radius: calc(var(--btn-r) - 2px); font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.k-seg span.on { background: var(--accent); color: var(--on-accent); font-weight: var(--btn-w); box-shadow: var(--sh); }
.k-fab {
  width: 52px; height: 52px; border-radius: var(--r-pill);
  background: var(--accent); color: var(--on-accent); box-shadow: var(--sh-lg);
  border: var(--btn-bw) var(--bstyle) var(--bc);
  display: inline-flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;
}

/* ---------- form controls ---------- */
.k-field { display: flex; flex-direction: column; gap: 6px; }
.k-field > label { font-family: var(--f-m); font-size: var(--lab-size); font-weight: var(--lab-w); letter-spacing: var(--lab-ls); text-transform: var(--lab-tt); color: var(--ink-2); }
.k-in {
  font-family: var(--f-b); font-size: 13.5px; padding: 10px 12px;
  background: var(--in-bg); color: var(--ink);
  border: var(--bw) var(--bstyle) var(--in-bc); border-radius: var(--in-r);
  box-shadow: var(--in-sh); width: 100%;
}
.k-in::placeholder { color: var(--ink-3); }
.k-in:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea.k-in { min-height: 78px; resize: vertical; }
select.k-in { appearance: none; cursor: pointer; }
.k-help { font-size: 11.5px; color: var(--ink-3); }
.k-err-t { font-size: 11.5px; color: var(--err); }
.k-ok-t { font-size: 11.5px; color: var(--ok); }
.k-in.is-err { border-color: var(--err); }
.k-in.is-ok  { border-color: var(--ok); }

.k-check { display: flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13.5px; color: var(--ink-2); }
.k-check i {
  width: 18px; height: 18px; flex: none; display: grid; place-items: center;
  border: var(--bw) var(--bstyle) var(--in-bc); border-radius: var(--r-sm);
  background: var(--in-bg); box-shadow: var(--in-sh);
  font-style: normal; font-size: 12px; color: var(--on-accent);
}
.k-check.on i { background: var(--accent); border-color: var(--accent); }
.k-check.radio i { border-radius: var(--r-pill); }
.k-check.radio.on i { box-shadow: inset 0 0 0 4px var(--in-bg); background: var(--accent); }

.k-switch { width: 44px; height: 25px; border-radius: var(--r-pill); background: var(--surface-3); border: var(--bw) var(--bstyle) var(--in-bc); position: relative; cursor: pointer; flex: none; box-shadow: var(--in-sh); }
.k-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: var(--r-pill); background: var(--surface); box-shadow: var(--sh); transition: left .18s ease; }
.k-switch.on { background: var(--accent); border-color: var(--accent); }
.k-switch.on::after { left: 21px; }

.k-slider { height: 6px; border-radius: var(--r-pill); background: var(--surface-3); position: relative; box-shadow: var(--in-sh); }
.k-slider i { position: absolute; inset: 0 38% 0 0; background: var(--accent); border-radius: var(--r-pill); }
.k-slider b { position: absolute; left: 62%; top: 50%; width: 17px; height: 17px; margin: -8.5px 0 0 -8.5px; border-radius: var(--r-pill); background: var(--surface); border: var(--bw) var(--bstyle) var(--bc); box-shadow: var(--sh); }

.k-drop {
  border: calc(var(--bw) + 1px) dashed var(--bc); border-radius: var(--r);
  padding: 26px; text-align: center; color: var(--ink-3); background: var(--surface-2);
  display: flex; flex-direction: column; gap: 5px; align-items: center;
}
.k-otp { display: flex; gap: 7px; }
.k-otp span { width: 38px; height: 46px; display: grid; place-items: center; font-family: var(--f-m); font-size: 18px; color: var(--ink); background: var(--in-bg); border: var(--bw) var(--bstyle) var(--in-bc); border-radius: var(--in-r); box-shadow: var(--in-sh); }
.k-taginput { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; background: var(--in-bg); border: var(--bw) var(--bstyle) var(--in-bc); border-radius: var(--in-r); box-shadow: var(--in-sh); }
.k-stars { display: flex; gap: 3px; font-size: 17px; color: var(--warn); letter-spacing: 2px; }
.k-stars em { color: var(--ink-3); font-style: normal; }

/* ---------- badges, chips, avatars ---------- */
.k-badge {
  font-family: var(--f-b); font-size: 10.5px; font-weight: 600;
  letter-spacing: var(--lab-ls); text-transform: var(--lab-tt);
  padding: 3px 9px; border-radius: var(--r-pill);
  background: var(--accent-soft); color: var(--accent-2);
  border: var(--bw) var(--bstyle) transparent; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 5px;
}
.k-badge.ok { background: var(--ok-soft); color: var(--ok); }
.k-badge.warn { background: var(--warn-soft); color: var(--warn); }
.k-badge.err { background: var(--err-soft); color: var(--err); }
.k-badge.solid { background: var(--accent); color: var(--on-accent); }
.k-badge.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.k-chip { font-size: 12px; padding: 4px 10px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--ink-2); border: var(--bw) var(--bstyle) var(--bc); display: inline-flex; gap: 6px; align-items: center; }
.k-chip b { color: var(--ink-3); font-weight: 400; cursor: pointer; }

.k-av { width: 38px; height: 38px; border-radius: var(--r-pill); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--f-b); font-weight: 700; font-size: 13.5px; flex: none; border: var(--bw) var(--bstyle) var(--bc); }
.k-av.sq { border-radius: var(--r-sm); }
.k-avs { display: flex; }
.k-avs .k-av { margin-left: -11px; box-shadow: 0 0 0 2px var(--surface); }
.k-avs .k-av:first-child { margin-left: 0; }

/* ---------- navigation ---------- */
.k-nav {
  display: flex; align-items: center; gap: 22px;
  padding: 13px 18px; background: var(--surface); border-radius: var(--r);
  border: var(--bw) var(--bstyle) var(--bc); box-shadow: var(--sh);
  backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
  flex-wrap: wrap;
}
.k-logo { font-family: var(--f-d); font-weight: var(--h-w); font-size: 16px; letter-spacing: var(--h-ls); text-transform: var(--h-tt); display: flex; align-items: center; gap: 8px; }
.k-logo span { width: 22px; height: 22px; border-radius: var(--r-sm); background: var(--accent); display: block; }
.k-navlinks { display: flex; gap: 18px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.k-navlinks b { color: var(--ink); font-weight: 600; position: relative; }
.k-navlinks b::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 2px; background: var(--accent); }

.k-side { background: var(--surface); border: var(--bw) var(--bstyle) var(--bc); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--sh); }
.k-side a { padding: 8px 11px; border-radius: var(--r-sm); font-size: 13px; color: var(--ink-2); text-decoration: none; display: flex; align-items: center; gap: 9px; }
.k-side a.on { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
.k-side hr { border: 0; border-top: var(--bw) var(--bstyle) var(--bc); margin: 7px 4px; }

.k-crumb { display: flex; gap: 8px; font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; align-items: center; }
.k-crumb b { color: var(--ink); font-weight: 600; }
.k-tabs { display: flex; gap: 2px; border-bottom: calc(var(--bw) + 1px) var(--bstyle) var(--bc); flex-wrap: wrap; }
.k-tabs span { padding: 9px 15px; font-size: 13px; color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.k-tabs span.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.k-page { display: flex; gap: 4px; flex-wrap: wrap; }
.k-page span { min-width: 33px; height: 33px; display: grid; place-items: center; border-radius: var(--r-sm); font-size: 12.5px; border: var(--bw) var(--bstyle) var(--bc); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.k-page span.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }

.k-steps { display: flex; align-items: flex-start; gap: 0; flex-wrap: wrap; }
.k-step { display: flex; flex-direction: column; gap: 6px; align-items: center; flex: 1; min-width: 96px; text-align: center; position: relative; }
.k-step i { width: 30px; height: 30px; border-radius: var(--r-pill); display: grid; place-items: center; font-style: normal; font-size: 12.5px; font-weight: 700; background: var(--surface-2); color: var(--ink-3); border: var(--bw) var(--bstyle) var(--bc); z-index: 2; }
.k-step.done i, .k-step.on i { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.k-step em { font-style: normal; font-size: 11.5px; color: var(--ink-3); }
.k-step.on em { color: var(--ink); font-weight: 600; }
.k-step::before { content: ""; position: absolute; top: 15px; left: -50%; right: 50%; height: var(--bw); background: var(--bc); }
.k-step:first-child::before { display: none; }
.k-step.done::before, .k-step.on::before { background: var(--accent); }

.k-menu { background: var(--surface); border: var(--bw) var(--bstyle) var(--bc); border-radius: var(--r); box-shadow: var(--sh-lg); padding: 6px; width: 190px; display: flex; flex-direction: column; gap: 1px; }
.k-menu a { padding: 8px 11px; border-radius: var(--r-sm); font-size: 13px; color: var(--ink-2); text-decoration: none; display: flex; justify-content: space-between; gap: 12px; }
.k-menu a.on { background: var(--surface-2); color: var(--ink); }
.k-menu a span { color: var(--ink-3); font-family: var(--f-m); font-size: 10.5px; }
.k-menu hr { border: 0; border-top: var(--bw) var(--bstyle) var(--bc); margin: 5px 2px; }

.k-cmdk { background: var(--surface); border: var(--bw) var(--bstyle) var(--bc); border-radius: var(--r-lg); box-shadow: var(--sh-lg); overflow: hidden; }
.k-cmdk .q { padding: 14px 16px; border-bottom: var(--bw) var(--bstyle) var(--bc); font-family: var(--f-m); font-size: 14px; color: var(--ink-3); display: flex; gap: 10px; align-items: center; }
.k-cmdk .res { padding: 6px; display: flex; flex-direction: column; gap: 1px; }
.k-cmdk .res a { padding: 9px 11px; border-radius: var(--r-sm); font-size: 13px; color: var(--ink-2); text-decoration: none; display: flex; justify-content: space-between; }
.k-cmdk .res a.on { background: var(--accent-soft); color: var(--accent-2); }

/* ---------- feedback ---------- */
.k-alert {
  display: flex; gap: 11px; padding: 13px 15px; border-radius: var(--r);
  background: var(--info-soft); color: var(--ink); font-size: 13px;
  border: var(--bw) var(--bstyle) transparent; border-left: 3px solid var(--info);
}
.k-alert.ok { background: var(--ok-soft); border-left-color: var(--ok); }
.k-alert.warn { background: var(--warn-soft); border-left-color: var(--warn); }
.k-alert.err { background: var(--err-soft); border-left-color: var(--err); }
.k-alert b { display: block; font-weight: 700; margin-bottom: 2px; }
.k-alert i { font-style: normal; font-size: 15px; line-height: 1.3; }

.k-toast { display: flex; align-items: center; gap: 11px; padding: 12px 15px; border-radius: var(--r); background: var(--surface); border: var(--bw) var(--bstyle) var(--bc); box-shadow: var(--sh-lg); font-size: 13px; max-width: 340px; }
.k-modal { background: var(--surface); border: var(--bw) var(--bstyle) var(--bc); border-radius: var(--r-lg); box-shadow: var(--sh-lg); overflow: hidden; max-width: 400px; }
.k-modal .mh { padding: 17px 20px; border-bottom: var(--bw) var(--bstyle) var(--bc); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.k-modal .mb { padding: 18px 20px; font-size: 13.5px; color: var(--ink-2); }
.k-modal .mf { padding: 14px 20px; background: var(--surface-2); display: flex; justify-content: flex-end; gap: 9px; border-top: var(--bw) var(--bstyle) var(--bc); }

.k-tip { display: inline-block; padding: 6px 10px; border-radius: var(--r-sm); background: var(--ink); color: var(--bg); font-size: 11.5px; box-shadow: var(--sh); }
.k-pop { background: var(--surface); border: var(--bw) var(--bstyle) var(--bc); border-radius: var(--r); box-shadow: var(--sh-lg); padding: 14px; width: 230px; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; }

.k-skel { display: flex; flex-direction: column; gap: 9px; }
.k-skel i { display: block; height: 11px; border-radius: var(--r-sm); background: var(--surface-3); animation: kpulse 1.5s ease-in-out infinite; }
@keyframes kpulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
.k-spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--surface-3); border-top-color: var(--accent); animation: kspin .8s linear infinite; }
@keyframes kspin { to { transform: rotate(360deg); } }
.k-empty-c { text-align: center; padding: 28px 20px; display: flex; flex-direction: column; gap: 8px; align-items: center; color: var(--ink-3); }
.k-empty-c i { width: 44px; height: 44px; border-radius: var(--r); background: var(--surface-2); border: var(--bw) var(--bstyle) var(--bc); display: grid; place-items: center; font-style: normal; font-size: 20px; }

/* ---------- data display ---------- */
.k-tablewrap { overflow-x: auto; border: var(--bw) var(--bstyle) var(--bc); border-radius: var(--r); background: var(--surface); }
.k-table { border-collapse: collapse; width: 100%; min-width: 460px; font-size: 13px; }
.k-table th { text-align: left; font-family: var(--f-m); font-size: var(--lab-size); font-weight: var(--lab-w); letter-spacing: var(--lab-ls); text-transform: var(--lab-tt); color: var(--ink-3); padding: 10px 15px; background: var(--surface-2); border-bottom: var(--bw) var(--bstyle) var(--bc); white-space: nowrap; }
.k-table td { padding: 11px 15px; border-bottom: var(--bw) var(--bstyle) var(--bc); color: var(--ink-2); }
.k-table tr:last-child td { border-bottom: 0; }
.k-table td:first-child { color: var(--ink); font-weight: 600; }
.k-table .num { font-family: var(--f-m); font-variant-numeric: tabular-nums; text-align: right; }

.k-list { background: var(--surface); border: var(--bw) var(--bstyle) var(--bc); border-radius: var(--r); overflow: hidden; }
.k-list .li { padding: 13px 16px; border-bottom: var(--bw) var(--bstyle) var(--bc); display: flex; align-items: center; gap: 12px; }

<style>

/* ripple / press feedback on any control */

/* ============================================================
   MOTION LAYER — every design carries its own movement
   character: easing curve, duration, hover lift, press response
   and an entrance style. Driven by tokens like everything else.
   ============================================================ */
.kit{
  --ease:cubic-bezier(.4,0,.2,1); --dur:180ms;
  --lift:translateY(-2px); --press:translateY(1px); --hover-sh:var(--sh-lg);

.kit .k-btn,.kit .k-card,.kit .k-stat,.kit .k-price,.kit .k-kcard,
.kit .k-chip,.kit .k-badge,.kit .k-seg span,.kit .k-page span,
.kit .k-tabs span,.kit .k-side a,.kit .k-menu a,.kit .k-av,.kit .k-fab,
.kit .k-switch,.kit .k-switch::after,.kit .k-in,.kit .k-gal i{
  transition:transform var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease),
             background-color var(--dur) var(--ease),
             border-color var(--dur) var(--ease),
             color var(--dur) var(--ease),
             filter var(--dur) var(--ease),
             left var(--dur) var(--ease);
}
.kit .k-btn:hover:not([disabled]){transform:var(--lift); box-shadow:var(--hover-sh);}
.kit .k-btn:active:not([disabled]){transform:var(--press);}
.kit .k-card:hover,.kit .k-stat:hover,.kit .k-price:hover,.kit .k-kcard:hover{
  transform:var(--lift); box-shadow:var(--hover-sh);
}
.kit .k-gal i:hover,.kit .k-av:hover{transform:var(--lift);}
.kit .k-fab:hover{transform:var(--lift) rotate(90deg);}

/* entrance — replayed each time a design is loaded, so the
   motion character is visible the moment you pick one */
.kit.enter .k-group > *{animation:kEnter calc(var(--dur) * 3.4) var(--ease) both;}
.kit.enter .k-group:nth-child(1) > *{animation-delay:0ms;}
.kit.enter .k-group:nth-child(2) > *{animation-delay:40ms;}
.kit.enter .k-group:nth-child(3) > *{animation-delay:80ms;}
.kit.enter .k-group > *:nth-child(2){animation-delay:60ms;}
.kit.enter .k-group > *:nth-child(3){animation-delay:100ms;}
.kit.enter .k-group > *:nth-child(4){animation-delay:140ms;}

@keyframes kEnter{ from{ opacity:0; transform:var(--enter-from, translateY(10px)); } }
.kit[data-reveal="fade"]  { --enter-from:none; }
.kit[data-reveal="rise"]  { --enter-from:translateY(14px); }
.kit[data-reveal="slide"] { --enter-from:translateX(-14px); }
.kit[data-reveal="scale"] { --enter-from:scale(.97); }
.kit[data-reveal="none"] .k-group > *{animation:none;}

   concurrent transitions per click and cross-fades surfaces from their
