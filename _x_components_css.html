<style>
/* ═══════════ EXTREME COMPONENTS ═══════════ */
.xlabel{
  font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--faint); margin:44px 0 14px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,.07);
}
.xgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:14px;}
.xcell{
  background:var(--void2); border:1px solid rgba(255,255,255,.09); border-radius:12px;
  padding:20px 18px; display:flex; flex-direction:column; gap:14px; align-items:flex-start;
  min-height:132px; justify-content:center; position:relative; overflow:hidden;
}
.xcell.wide{grid-column:1 / -1;}
.xname{
  position:absolute; top:10px; left:14px; font-family:var(--mono); font-size:9px;
  letter-spacing:.16em; text-transform:uppercase; color:var(--faint);
}
.xhint{font-family:var(--mono); font-size:9.5px; color:var(--faint);}

/* base button */
.xbtn{
  font-family:var(--body); font-size:14px; font-weight:600; letter-spacing:.01em;
  padding:13px 26px; border-radius:10px; border:0; cursor:pointer; position:relative;
  background:var(--cy); color:#04231F; overflow:hidden; isolation:isolate;
}
.xbtn.sm{padding:9px 16px; font-size:12.5px;}

/* 1 gooey magnetic */
.goo-host{position:relative; filter:url(#goo); padding:12px 0; width:100%; display:grid; place-items:center;}
.goo-blob{position:absolute; width:34px; height:34px; border-radius:50%; background:var(--cy); pointer-events:none; will-change:transform;}
.goo-blob.b2{width:22px; height:22px; background:var(--cy);}
.goo-btn{background:var(--cy); color:#04231F;}

/* 2 liquid fill */
.xbtn.liquid{background:transparent; color:var(--cy); border:1px solid var(--cy); padding:0; width:190px; height:54px;}
.xbtn.liquid .lq{position:absolute; inset:0; overflow:hidden; z-index:-1;}
.xbtn.liquid .lq svg{position:absolute; left:0; bottom:-100%; width:200%; height:100%; transition:bottom .55s cubic-bezier(.4,0,.2,1); animation:lqWave 3.2s linear infinite;}
.xbtn.liquid .lq path{fill:var(--cy);}
.xbtn.liquid:hover .lq svg{bottom:-6%;}
.xbtn.liquid .lb{position:relative; line-height:54px; transition:color .35s .12s;}
.xbtn.liquid:hover .lb{color:#04231F;}
@keyframes lqWave{to{transform:translateX(-50%);}}

/* 3 particle burst */
.burst-host{position:relative; width:100%; display:grid; place-items:center;}
.burst-cv{position:absolute; inset:-70px; width:calc(100% + 140px); height:calc(100% + 140px); pointer-events:none;}
.xbtn.burst{background:var(--hot); color:#fff;}

/* 4 border draw */
.xbtn.draw{background:transparent; color:var(--ink); padding:0; width:200px; height:56px;}
.xbtn.draw .dr{position:absolute; inset:0; width:100%; height:100%;}
.xbtn.draw .dr rect{fill:none; stroke:var(--vi); stroke-width:2; stroke-dasharray:504; stroke-dashoffset:504; transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1);}
.xbtn.draw:hover .dr rect{stroke-dashoffset:0;}
.xbtn.draw span{line-height:56px; position:relative;}

/* 5 scramble */
.xbtn.scramble{background:transparent; border:1px solid var(--faint); color:var(--ink); font-family:var(--mono); letter-spacing:.14em; min-width:170px;}
.xbtn.scramble:hover{border-color:var(--cy); color:var(--cy);}

/* 6 icon morph */
.xbtn.icon-morph{width:58px; height:58px; padding:0; border-radius:50%; background:var(--vi); display:grid; place-items:center;}
.xbtn.icon-morph svg{width:26px; height:26px;}
.xbtn.icon-morph path{fill:#fff; transition:d .3s cubic-bezier(.4,0,.2,1);}

/* 7 depth press */
.xbtn.press{
  background:var(--gold); color:#241800; box-shadow:0 7px 0 #A67A16, 0 12px 22px rgba(0,0,0,.5);
  transition:transform .1s, box-shadow .1s;
}
.xbtn.press:active{transform:translateY(7px); box-shadow:0 0 0 #A67A16, 0 3px 8px rgba(0,0,0,.5);}

/* 8 glitch */
.xbtn.glitchbtn{background:#12141C; color:var(--ink); border:1px solid rgba(255,255,255,.14); font-family:var(--mono); letter-spacing:.14em;}
.xbtn.glitchbtn::before,.xbtn.glitchbtn::after{
  content:attr(data-txt); position:absolute; inset:0; display:grid; place-items:center; opacity:0;
}
.xbtn.glitchbtn::before{color:var(--hot); }
.xbtn.glitchbtn::after{color:var(--cy);}
.xbtn.glitchbtn:hover::before{opacity:1; animation:gl1 .38s steps(2) infinite;}
.xbtn.glitchbtn:hover::after{opacity:1; animation:gl2 .31s steps(2) infinite;}
@keyframes gl1{0%{transform:translate(-3px,1px);}50%{transform:translate(2px,-2px);}100%{transform:translate(-2px,0);}}
@keyframes gl2{0%{transform:translate(3px,-1px);}50%{transform:translate(-2px,2px);}100%{transform:translate(2px,0);}}

/* 9 async → success */
.xbtn.async{background:var(--cy); color:#04231F; min-width:150px; height:50px; display:grid; place-items:center;}
.xbtn.async .txt,.xbtn.async .spin,.xbtn.async .tick{grid-area:1/1; transition:opacity .22s,transform .22s;}
.xbtn.async .spin{width:20px; height:20px; border-radius:50%; border:2.5px solid rgba(4,35,31,.25); border-top-color:#04231F; opacity:0; transform:scale(.6);}
.xbtn.async .tick{width:26px; height:26px; opacity:0; transform:scale(.6);}
.xbtn.async .tick path{fill:none; stroke:#04231F; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:26; stroke-dashoffset:26;}
.xbtn.async.loading .txt{opacity:0; transform:scale(.85);}
.xbtn.async.loading .spin{opacity:1; transform:scale(1); animation:spin .7s linear infinite;}
.xbtn.async.done{background:#3BE08A;}
.xbtn.async.done .spin{opacity:0;}
.xbtn.async.done .tick{opacity:1; transform:scale(1);}
.xbtn.async.done .tick path{animation:drawTick .45s cubic-bezier(.4,0,.2,1) forwards;}
@keyframes spin{to{transform:rotate(360deg) scale(1);}}
@keyframes drawTick{to{stroke-dashoffset:0;}}

/* 10 shine */
.xbtn.shine{background:linear-gradient(120deg,#22252F,#333846); color:var(--ink); border:1px solid rgba(255,255,255,.12);}
.xbtn.shine::after{
  content:""; position:absolute; top:0; bottom:0; width:60%; left:-70%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent); transform:skewX(-22deg);
}
.xbtn.shine:hover::after{animation:sweep .8s ease;}
@keyframes sweep{to{left:130%;}}

/* fields */
.xfield{position:relative; display:block; width:100%;}
.xfield input{
  width:100%; background:transparent; border:0; border-bottom:1px solid var(--faint);
  color:var(--ink); font-family:var(--body); font-size:15px; padding:12px 2px 9px; outline:none;
}
.xfield .fl{
  position:absolute; left:2px; top:12px; color:var(--faint); font-size:15px; pointer-events:none;
  transition:transform .28s cubic-bezier(.4,0,.2,1), color .28s, font-size .28s; transform-origin:left;
}
.xfield input:focus + .fl,.xfield input:not(:placeholder-shown) + .fl{transform:translateY(-20px) scale(.72); color:var(--cy);}
.xfield .ul{position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--cy); transform:scaleX(0); transform-origin:left; transition:transform .34s cubic-bezier(.4,0,.2,1);}
.xfield input:focus ~ .ul{transform:scaleX(1);}

/* OTP */
.xotp{display:flex; gap:8px; outline:none;}
.xotp span{
  width:42px; height:52px; display:grid; place-items:center; border-radius:9px;
  background:#12141C; border:1px solid rgba(255,255,255,.12); font-family:var(--mono); font-size:20px; color:var(--ink);
  transition:border-color .2s, box-shadow .2s, transform .2s;
}
.xotp.focus span.cur{border-color:var(--cy); box-shadow:0 0 0 3px rgba(56,242,228,.18);}
.xotp.bad{animation:shake .42s cubic-bezier(.36,.07,.19,.97);}
.xotp.bad span{border-color:var(--hot);}
.xotp.good span{border-color:#3BE08A; box-shadow:0 0 0 3px rgba(59,224,138,.16);}
@keyframes shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-7px);}40%,60%{transform:translateX(7px);}}

/* search */
.xsearch{display:flex; align-items:center; gap:9px; background:#12141C; border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:10px 14px; transition:width .42s cubic-bezier(.4,0,.2,1),border-color .3s; width:52px; overflow:hidden;}
.xsearch svg{width:18px; height:18px; flex:none; fill:none; stroke:var(--faint); stroke-width:2; stroke-linecap:round; transition:stroke .3s;}
.xsearch input{background:transparent; border:0; outline:none; color:var(--ink); font-family:var(--body); font-size:14px; width:100%; opacity:0; transition:opacity .3s;}
.xsearch.open{width:100%; border-color:var(--cy);}
.xsearch.open svg{stroke:var(--cy);}
.xsearch.open input{opacity:1;}

/* slider */
.xslider{position:relative; width:100%; height:6px; border-radius:999px; background:#1B1E28; cursor:pointer; touch-action:none;}
.xslider .fill{position:absolute; left:0; top:0; bottom:0; width:62%; border-radius:999px; background:linear-gradient(90deg,var(--vi),var(--cy));}
.xslider .knob{position:absolute; top:50%; left:62%; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; background:#fff; box-shadow:0 3px 12px rgba(0,0,0,.6); transition:transform .18s;}
.xslider.drag .knob{transform:scale(1.35);}
.xslider .bub{
  position:absolute; bottom:26px; left:50%; transform:translateX(-50%) scale(.5); opacity:0;
  background:var(--cy); color:#04231F; font-family:var(--mono); font-size:11px; padding:3px 8px; border-radius:6px;
  transition:opacity .2s, transform .2s; font-style:normal;
}
.xslider.drag .bub,.xslider:hover .bub{opacity:1; transform:translateX(-50%) scale(1);}

/* toggle */
.xtoggle{width:66px; height:34px; border-radius:999px; background:#1B1E28; border:1px solid rgba(255,255,255,.12); position:relative; cursor:pointer; transition:background .3s;}
.xtoggle i{position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:999px; background:var(--faint);
  transition:left .42s cubic-bezier(.5,1.8,.4,1), width .3s, background .3s;}
.xtoggle:active i{width:36px;}
.xtoggle.on{background:rgba(56,242,228,.2);}
.xtoggle.on i{left:calc(100% - 29px); background:var(--cy);}

/* checkbox */
.xchecks{display:flex; flex-direction:column; gap:12px;}
.xcheck{display:flex; align-items:center; gap:10px; cursor:pointer; font-size:14px; color:var(--dim);}
.xcheck input{position:absolute; opacity:0; pointer-events:none;}
.xcheck svg{width:22px; height:22px; border-radius:7px; background:#12141C; border:1px solid rgba(255,255,255,.15); padding:2px; flex:none; transition:background .25s,border-color .25s;}
.xcheck svg path{fill:none; stroke:#04231F; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:26; stroke-dashoffset:26; transition:stroke-dashoffset .4s cubic-bezier(.4,0,.2,1);}
.xcheck input:checked + svg{background:var(--cy); border-color:var(--cy);}
.xcheck input:checked + svg path{stroke-dashoffset:0;}

/* segment */
.xseg{position:relative; display:inline-flex; background:#12141C; border-radius:999px; padding:4px; border:1px solid rgba(255,255,255,.1);}
.xseg span{position:relative; z-index:1; padding:8px 18px; font-size:13px; color:var(--dim); cursor:pointer; transition:color .3s;}
.xseg span.on{color:#04231F;}
.xseg .ind{position:absolute; top:4px; bottom:4px; border-radius:999px; background:var(--cy); transition:left .45s cubic-bezier(.5,1.5,.4,1), width .45s cubic-bezier(.5,1.5,.4,1);}

/* tags */
.xtags{display:flex; flex-wrap:wrap; gap:6px; align-items:center; width:100%; background:#12141C; border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:8px;}
.xtags .tg{display:inline-flex; align-items:center; gap:6px; background:rgba(56,242,228,.14); color:var(--cy); font-size:12px; padding:5px 10px; border-radius:999px; animation:pop .34s cubic-bezier(.5,1.7,.4,1);}
.xtags .tg b{cursor:pointer; opacity:.6;}
.xtags input{flex:1; min-width:70px; background:transparent; border:0; outline:none; color:var(--ink); font-size:13px; font-family:var(--body);}
@keyframes pop{from{transform:scale(.4); opacity:0;}}

/* tabs */
.xtabs{position:relative; display:flex; gap:2px; border-bottom:1px solid rgba(255,255,255,.1); width:100%;}
.xtabs span{padding:13px 20px; font-size:14px; color:var(--dim); cursor:pointer; transition:color .3s; position:relative; z-index:1;}
.xtabs span.on{color:var(--cy);}
.xtabs .ind{position:absolute; bottom:-1px; height:2px; background:var(--cy); transition:left .5s cubic-bezier(.5,1.4,.35,1), width .5s cubic-bezier(.5,1.4,.35,1);}

/* dock */
.xdock{display:flex; align-items:flex-end; gap:9px; height:74px; padding-bottom:4px;}
.xdock i{width:36px; height:36px; border-radius:11px; display:block; transform-origin:bottom center; will-change:transform;}

/* stagger menu */
.xmenu-host{position:relative; width:100%;}
.xmenu{position:absolute; top:100%; left:0; margin-top:8px; background:#12141C; border:1px solid rgba(255,255,255,.12); border-radius:11px; padding:6px; width:180px; z-index:9; opacity:0; pointer-events:none; transform:translateY(-6px); transition:opacity .2s,transform .2s;}
.xmenu.open{opacity:1; pointer-events:auto; transform:none;}
.xmenu a{display:block; padding:9px 12px; border-radius:7px; color:var(--dim); text-decoration:none; font-size:13.5px; opacity:0; transform:translateX(-10px);}
.xmenu.open a{animation:mIn .34s cubic-bezier(.3,1.4,.4,1) forwards;}
.xmenu a:hover{background:rgba(255,255,255,.06); color:var(--ink);}
@keyframes mIn{to{opacity:1; transform:none;}}

/* toasts */
.xtoasts{position:relative; width:100%; display:flex; flex-direction:column; gap:7px;}
.xtoast{display:flex; align-items:center; gap:10px; background:#12141C; border:1px solid rgba(255,255,255,.13); border-left:3px solid var(--cy); border-radius:9px; padding:10px 13px; font-size:12.5px; color:var(--dim); animation:tIn .4s cubic-bezier(.3,1.5,.4,1);}
.xtoast.out{animation:tOut .3s ease forwards;}
@keyframes tIn{from{transform:translateX(26px) scale(.94); opacity:0;}}
@keyframes tOut{to{transform:translateX(26px); opacity:0; height:0; padding:0; margin:0;}}

/* liquid progress */
.xprog{position:relative; width:100%; border-radius:10px; overflow:hidden; background:#12141C; border:1px solid rgba(255,255,255,.1);}
.xprog svg{width:100%; height:44px; display:block;}
.xprog .pbg{fill:#12141C;}
.xprog .pw{fill:var(--cy); opacity:.85;}
.xprog .pv{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--mono); font-size:13px; color:var(--ink); mix-blend-mode:difference;}

/* odometer */
.xodo{display:flex; gap:2px; font-family:var(--disp); font-size:42px; line-height:1;}
.xodo .dg{width:26px; height:52px; overflow:hidden; position:relative; background:#12141C; border-radius:6px;}
.xodo .dg .strip{position:absolute; left:0; right:0; top:0; display:flex; flex-direction:column; align-items:center; transition:transform .9s cubic-bezier(.4,0,.2,1);}
.xodo .dg .strip span{height:52px; line-height:52px;}

/* loaders */
.xload{display:flex; gap:22px; align-items:center;}
.xload .l1{width:30px; height:30px; border-radius:9px; background:var(--cy); animation:l1 1.4s cubic-bezier(.5,0,.5,1) infinite;}
@keyframes l1{0%{transform:rotate(0) scale(1);}50%{transform:rotate(180deg) scale(.55); border-radius:50%;}100%{transform:rotate(360deg) scale(1);}}
.xload .l2{display:flex; gap:5px;}
.xload .l2 i{width:8px; height:8px; border-radius:50%; background:var(--hot); animation:l2 1.1s ease-in-out infinite;}
.xload .l2 i:nth-child(2){animation-delay:.14s;} .xload .l2 i:nth-child(3){animation-delay:.28s;}
@keyframes l2{0%,100%{transform:translateY(0); opacity:.35;}50%{transform:translateY(-11px); opacity:1;}}
.xload .l3 svg{width:34px; height:34px; animation:spin 1.6s linear infinite;}
.xload .l3 circle{fill:none; stroke:var(--vi); stroke-width:3; stroke-linecap:round; stroke-dasharray:100; animation:l3 1.6s ease-in-out infinite;}
@keyframes l3{0%{stroke-dashoffset:95;}50%{stroke-dashoffset:25;}100%{stroke-dashoffset:95;}}

/* skeleton */
.xskel{display:flex; flex-direction:column; gap:9px; width:100%;}
.xskel i{height:12px; border-radius:6px; background:linear-gradient(90deg,#161923 25%,#232735 50%,#161923 75%); background-size:220% 100%; animation:shimmer 1.5s linear infinite; display:block;}
@keyframes shimmer{to{background-position:-220% 0;}}

/* spotlight */
.xspot{position:relative; width:100%; padding:22px; border-radius:12px; background:#101320; border:1px solid rgba(255,255,255,.09); overflow:hidden; cursor:default;}
.xspot .sp{position:absolute; width:280px; height:280px; border-radius:50%; pointer-events:none; opacity:0; transition:opacity .3s;
  background:radial-gradient(closest-side,rgba(56,242,228,.22),transparent); transform:translate(-50%,-50%);}
.xspot:hover .sp{opacity:1;}
.xspot b{display:block; font-size:16px; margin-bottom:6px; position:relative;}
.xspot small{color:var(--dim); font-size:12.5px; position:relative;}

/* FLIP */
.xflip{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; width:100%;}
.xflip .ft{aspect-ratio:1; border-radius:12px; cursor:pointer; display:grid; place-items:center; font-family:var(--mono); font-size:11px; color:#04231F; will-change:transform;}
.xflip .ft.active{position:fixed; z-index:90; inset:auto; border-radius:16px;}
.xflip-scrim{position:fixed; inset:0; background:rgba(5,6,10,.72); z-index:89; opacity:0; pointer-events:none; transition:opacity .3s;}
.xflip-scrim.on{opacity:1; pointer-events:auto;}

@media (prefers-reduced-motion:reduce){
  .xbtn,.xtoggle i,.xseg .ind,.xtabs .ind{transition:none!important;}
  .xload .l1,.xload .l2 i,.xload .l3 svg,.xload .l3 circle,.xskel i{animation:none!important;}
}
</style>
