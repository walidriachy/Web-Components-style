<style>
/* ============================================================
   DATABASE VIEWER SHELL — .db- prefix, never leaks into .kit
   ============================================================ */
:root{
  --db-bg:#F2F3F5; --db-panel:#FFF; --db-panel-2:#EAECEF;
  --db-ink:#12151A; --db-ink-2:#525B67; --db-ink-3:#828C99;
  --db-rule:#D7DBE1; --db-rule-2:#E6E9ED;
  --db-accent:#3A5B78; --db-accent-2:#24455F; --db-tint:#E1E9F0;
  --db-ok:#1D7F4C; --db-warn:#9A6B00; --db-err:#B3261E;
  --db-shadow:0 1px 2px rgba(18,21,26,.05),0 10px 30px -18px rgba(18,21,26,.32);
  --db-m:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --db-d:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --db-bg:#0C0D0F; --db-panel:#14171B; --db-panel-2:#1A1E23;
    --db-ink:#E8EBEF; --db-ink-2:#A1ABB7; --db-ink-3:#737D8A;
    --db-rule:#262B32; --db-rule-2:#1E232A;
    --db-accent:#8CB3D1; --db-accent-2:#B4D2E8; --db-tint:#182530;
    --db-ok:#4ADE80; --db-warn:#E0B050; --db-err:#F27272;
    --db-shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --db-bg:#0C0D0F; --db-panel:#14171B; --db-panel-2:#1A1E23;
  --db-ink:#E8EBEF; --db-ink-2:#A1ABB7; --db-ink-3:#737D8A;
  --db-rule:#262B32; --db-rule-2:#1E232A;
  --db-accent:#8CB3D1; --db-accent-2:#B4D2E8; --db-tint:#182530;
  --db-ok:#4ADE80; --db-warn:#E0B050; --db-err:#F27272;
  --db-shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box;}
body{
  margin:0; background:var(--db-bg); color:var(--db-ink);
  font-family:var(--db-m); font-size:13.5px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.db{max-width:1560px; margin:0 auto; padding:0 22px 120px;}

/* ---------- masthead ---------- */
.db-head{padding:52px 0 26px; display:flex; flex-direction:column; gap:14px;}
.db-head h1{
  font-family:var(--db-d); font-size:clamp(32px,5vw,58px); font-weight:800;
  letter-spacing:-.035em; line-height:.98; margin:0; max-width:20ch;
}
.db-head p{margin:0; color:var(--db-ink-2); max-width:70ch; font-family:var(--db-d); font-size:15.5px; line-height:1.55;}
.db-eyebrow{font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--db-accent); margin:0;}
.db-facts{display:flex; flex-wrap:wrap; gap:5px 16px; font-size:11px; color:var(--db-ink-3); letter-spacing:.04em;}
.db-facts b{color:var(--db-ink); font-weight:600;}

/* ---------- toolbar ---------- */
.db-bar{
  position:sticky; top:0; z-index:70;
  background:var(--db-bg); background:color-mix(in srgb,var(--db-bg) 92%,transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--db-rule);
  margin:0 -22px; padding:11px 22px; display:flex; flex-direction:column; gap:9px;
}
.db-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.db-in{
  flex:1 1 220px; min-width:0; font-family:var(--db-m); font-size:12.5px;
  padding:8px 12px; color:var(--db-ink); background:var(--db-panel);
  border:1px solid var(--db-rule); border-radius:4px;
}
.db-in::placeholder{color:var(--db-ink-3);}
.db-btn{
  font-family:var(--db-m); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
  padding:7px 11px; border-radius:3px; cursor:pointer; white-space:nowrap;
  background:var(--db-panel); color:var(--db-ink-2); border:1px solid var(--db-rule);
}
.db-btn:hover{border-color:var(--db-accent); color:var(--db-accent);}
.db-btn.on,.db-btn[aria-pressed="true"]{background:var(--db-accent); border-color:var(--db-accent); color:var(--db-bg);}
.db-count{font-size:11px; color:var(--db-ink-3); white-space:nowrap; letter-spacing:.05em; margin-left:auto;}
select.db-btn{text-transform:none; letter-spacing:0; font-size:11.5px;}
:where(button,input,select,a):focus-visible{outline:2px solid var(--db-accent); outline-offset:2px;}

/* ---------- contact sheet ---------- */
.db-sheet{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(176px,1fr)); gap:11px;
  margin-top:22px;
}
.tile{
  all:unset; cursor:pointer; display:block; border-radius:6px; overflow:hidden;
  border:1px solid var(--db-rule); position:relative;
  transition:transform .13s ease,box-shadow .13s ease,border-color .13s ease;
}
.tile:hover{transform:translateY(-3px); box-shadow:var(--db-shadow); border-color:var(--db-accent);}
.tile[aria-current="true"]{border-color:var(--db-accent); box-shadow:0 0 0 2px var(--db-accent);}
.tile-face{
  padding:13px; height:124px; display:flex; flex-direction:column; gap:7px;
  position:relative; overflow:hidden;
}
.tile-aa{font-size:24px; line-height:1;}
.tile-card{flex:1; display:flex; align-items:center; justify-content:space-between; gap:7px; padding:8px 9px;}
.tile-chip{font-size:9px; padding:5px 8px; white-space:nowrap;}
.tile-sw{display:flex; gap:3px;}
.tile-sw i{width:10px; height:10px; display:block; border-radius:2px;}
.tile-meta{
  background:var(--db-panel); border-top:1px solid var(--db-rule);
  padding:7px 9px; display:flex; align-items:center; gap:6px;
}
.tile-meta .tm{flex:1; min-width:0; display:flex; flex-direction:column;}
.tile-name{font-size:11px; font-weight:600; color:var(--db-ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tile-fam{font-size:8.5px; color:var(--db-ink-3); letter-spacing:.08em; text-transform:uppercase;}
.tile-star{cursor:pointer; font-size:12px; line-height:1; color:var(--db-ink-3); padding:2px;}
.tile-star.on{color:#E8A317;}
.tile-a11y{
  position:absolute; top:7px; right:8px; font-size:8px; letter-spacing:.06em;
  padding:2px 5px; border-radius:2px; font-family:var(--db-m); font-weight:600;
}
.tile-a11y.aaa{background:rgba(29,127,76,.9); color:#fff;}
.tile-a11y.aa{background:rgba(154,107,0,.9); color:#fff;}
.tile-a11y.fail{background:rgba(179,38,30,.9); color:#fff;}

/* ---------- stage ---------- */
.db-sec{margin-top:44px;}
.db-sec-h{
  display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
  border-bottom:1px solid var(--db-rule); padding-bottom:10px; margin-bottom:18px;
}
.db-sec-h h2{font-family:var(--db-d); font-size:20px; font-weight:700; letter-spacing:-.02em; margin:0;}
.db-sec-h p{margin:3px 0 0; color:var(--db-ink-3); font-size:11.5px; max-width:64ch;}

.db-stagebar{
  position:sticky; top:88px; z-index:60;
  background:var(--db-panel); border:1px solid var(--db-rule); border-radius:6px 6px 0 0;
  padding:12px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.db-stagebar .id{display:flex; flex-direction:column; gap:2px; min-width:0;}
.db-stagebar .nm{font-family:var(--db-d); font-size:18px; font-weight:700; letter-spacing:-.02em;}
.db-stagebar .nt{font-size:11px; color:var(--db-ink-3); max-width:70ch; line-height:1.5;}
.db-tag{font-size:9px; letter-spacing:.1em; text-transform:uppercase; padding:3px 7px; border-radius:3px;
  background:var(--db-tint); color:var(--db-accent); border:1px solid var(--db-rule); white-space:nowrap;}
.db-stagebar .sp{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap;}

.db-stage{border:1px solid var(--db-rule); border-top:0; overflow:hidden;}
.db-stage.narrow{max-width:420px;}
.db-stage.tablet{max-width:800px;}

/* ---------- panels ---------- */
.db-panels{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
@media (max-width:900px){ .db-panels{grid-template-columns:1fr;} }
.db-panel{border:1px solid var(--db-rule); border-radius:6px; background:var(--db-panel); overflow:hidden;}
.db-panel h3{
  margin:0; padding:11px 15px; font-family:var(--db-m); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--db-ink-2); border-bottom:1px solid var(--db-rule);
  display:flex; align-items:center; gap:9px;
}
.db-panel .body{padding:14px 15px;}
.db-panel pre{margin:0; font-family:var(--db-m); font-size:11px; line-height:1.7; color:var(--db-ink-2); overflow-x:auto; max-height:340px;}
.db-panel .tk{color:var(--db-accent);}

.a11y-row{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--db-rule-2); font-size:11.5px;}
.a11y-row:last-child{border-bottom:0;}
.a11y-row .lbl{flex:1; color:var(--db-ink-2);}
.a11y-row .ratio{font-variant-numeric:tabular-nums; color:var(--db-ink); min-width:44px; text-align:right;}
.a11y-row .badge{font-size:9px; letter-spacing:.07em; padding:2px 6px; border-radius:2px; min-width:38px; text-align:center; font-weight:600;}
.badge.aaa{background:rgba(29,127,76,.16); color:var(--db-ok);}
.badge.aa{background:rgba(154,107,0,.18); color:var(--db-warn);}
.badge.fail{background:rgba(179,38,30,.16); color:var(--db-err);}
.a11y-swatch{width:26px; height:18px; border-radius:3px; border:1px solid var(--db-rule); display:grid; place-items:center; font-size:9px; flex:none;}

/* ---------- compare ---------- */
.db-compare{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
@media (max-width:820px){ .db-compare{grid-template-columns:1fr;} }
.cmp{border:1px solid var(--db-rule); border-radius:6px; overflow:hidden;}
.cmp .cmp-h{padding:9px 13px; background:var(--db-panel); border-bottom:1px solid var(--db-rule);
  display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:11.5px;}
.cmp .cmp-h b{font-weight:600;}
.cmp-body{padding:0;}
#compareWrap[hidden]{display:none;}

.db-empty{display:none; padding:44px 0; color:var(--db-ink-3); font-size:12.5px;}
.db-loading{padding:44px 0; color:var(--db-ink-3); font-size:12.5px;}
footer.db-foot{
  margin-top:64px; padding-top:18px; border-top:1px solid var(--db-rule);
  font-size:11px; color:var(--db-ink-3); line-height:1.9;
}

@media (max-width:720px){
  .db{padding:0 13px 80px;}
  .db-bar{margin:0 -13px; padding:10px 13px;}
  .db-sheet{grid-template-columns:repeat(auto-fill,minmax(142px,1fr)); gap:8px;}
  .db-stagebar{top:120px;}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important;} }
</style>
